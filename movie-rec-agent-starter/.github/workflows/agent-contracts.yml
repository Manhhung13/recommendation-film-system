name: agent-contracts
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agent.txt
      - run: python scripts/agentctl.py validate
      - run: python -m unittest discover -s tests/harness -v
      # Scope: agent contract validation ONLY. Does not certify MovieRec implementation.

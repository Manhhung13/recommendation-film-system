id: SDLC-INTEGRATION-001
title: Integrate MovieRec Agent SDLC kit
type: infra
source_slides:
- 2
- 10
- 11
status: PLANNED
dependencies: []
description: Integrate the existing reference kit into repository-root operation without
  changing data pipeline behavior. Revalidate under owner-approved lightweight development
  policy; retire external trust controllers.
allowed_paths:
- AGENTS.md
- .gitignore
- .github/
- docs/
- movie-rec-agent-starter/
- tests/
acceptance_criteria:
- id: SDLC-INTEGRATION-001-AC-01
  description: Task registry and dependency graph validate from repository root
  planned_test: tests/harness/test_integration_001.py
  test_case: test_sdlc_integration_001_registry_from_root
- id: SDLC-INTEGRATION-001-AC-02
  description: Root workflow runs contract, harness, and repository integration checks
  planned_test: tests/harness/test_integration_001.py
  test_case: test_sdlc_integration_001_workflow_runs_harness
- id: SDLC-INTEGRATION-001-AC-03
  description: Git preflight enforces exact files and directory prefixes
  planned_test: tests/harness/test_integration_001.py
  test_case: test_sdlc_integration_001_allowlist_paths
required_checks:
- unit_tests
- integration_tests
policy_notes:
- Do not change the data acquisition or validation pipeline.
- Agent roles, tool contracts and declarative workflows require compatible runtime
  enforcement.
- 'D-SDLC-2026-10-31: tests, scoped commit, push and matching remote SHA required
  for DONE; CI/review separate.'
git:
  branch_rule: feature/<feature-name>
  commit_prefix: '[SDLC-INTEGRATION-001]'
  push_after_tests: true
  done_after_tests_commit_push_remote_sha: true
test_suites:
- tests/harness
- movie-rec-agent-starter/tests/harness

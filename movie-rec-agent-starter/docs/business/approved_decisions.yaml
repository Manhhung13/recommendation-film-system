schema_version: 1
decisions:
  D-SDLC-2026-10-31:
    status: APPROVED
    approved_by: repository owner
    source: Explicit owner instruction in Codex on 2026-10-31, SIMPLIFY SDLC AND RESUME DEVELOPMENT.
    scope: Development SDLC only; no open product decision D-01 through D-10 is approved by this change.
  D-CLEAN-2026-11-01:
    status: APPROVED
    approved_by: repository owner
    source: Explicit owner instruction in Codex on 2026-11-01, MovieRec Data Quality Policy.
    scope: Preserve raw data and valid MovieLens rows; quarantine ambiguous external
      metadata; measure impact and coverage. Does not approve D-08 or model use.
  D-08:
    status: APPROVED
    approved_by: repository owner
    source: Explicit owner instruction in Codex on 2026-11-02, MovieRec limited local research approval.
    scope: Existing local MovieLens 25M, official IMDb dataset files and previously
      collected TMDb data for private, non-commercial research and data engineering only.
    conditions:
    - No re-download, new API calls, raw-data mutation, dataset redistribution or
      publication of a replacement movie database.
    - Record source, provenance, version and SHA-256 for each local input; compare
      hashes before and after processing. Retain applicable source terms and attribution.
    - This approval does not grant commercial use, public deployment or unrestricted
      model-training rights. Temporal availability and leakage remain separate gates.
    - Flag any file whose acquisition origin or permitted use cannot be verified;
      resolve the flag before using that file in downstream enrichment.
    fingerprinted_on: "2026-11-02"

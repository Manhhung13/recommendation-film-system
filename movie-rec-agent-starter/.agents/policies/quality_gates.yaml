version: 2
phase_order:
- ELIGIBLE
- IMPLEMENT
- TEST
- COMMIT
- PUSH
- DONE
always_required:
- acceptance_tests
- task_dependencies
- dataset_integrity
- scoped_commit
- successful_push
- remote_head_sha_match
conditional_by_type:
  data:
  - schema_validation
  - id_mapping_checks
  - provenance
  ml:
  - temporal_leakage_check
  - baseline_comparison
  - ranking_metrics_report
  api:
  - contract_tests
  - negative_tests
  ops:
  - failure_recovery_tests
ml_metric_definitions:
- rmse
- mae
- precision_at_k
- recall_at_k
- ndcg_at_k
- coverage
- diversity
- novelty
threshold_policy: Must be agreed before model evaluation; slide provides metrics,
  not numeric thresholds.
agent_contract_ci_checks:
- validate-contracts
product_ci_checks:
- test
state_progression: DONE requires passing real tests, scoped task commit and successful
  push with origin branch SHA equal to local HEAD. CI is reported separately.
owner_decision: D-SDLC-2026-10-31
optional_checks:
- independent_review
- github_ci

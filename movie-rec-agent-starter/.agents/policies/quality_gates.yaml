version: 1
phase_order:
- requirements
- design
- implementation
- local_tests
- review
- commit
- push
- remote_ci
- verified
always_required:
- acceptance_tests
- independent_review
- remote_ci_sha_match
conditional_by_type:
  data:
  - schema_validation
  - id_mapping_checks
  - provenance
  ml:
  - temporal_leakage_check
  - baseline_comparison
  - ranking_metrics_report
  api:
  - contract_tests
  - negative_tests
  ops:
  - failure_recovery_tests
ml_metric_definitions:
- rmse
- mae
- precision_at_k
- recall_at_k
- ndcg_at_k
- coverage
- diversity
- novelty
threshold_policy: Must be agreed before model evaluation; slide provides metrics, not numeric thresholds.
agent_contract_ci_checks:
- validate-contracts
product_ci_checks:
- test
state_progression: No transition to VERIFIED without trusted remote CI result for exact head_sha; local runner
  demo does not implement production enforcement.

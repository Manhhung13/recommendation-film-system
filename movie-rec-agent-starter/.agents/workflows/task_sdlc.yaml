id: task-sdlc
owner_decision: D-SDLC-2026-10-31
states: [ELIGIBLE, IMPLEMENT, TEST, COMMIT, PUSH, DONE, NEEDS_REWORK, BLOCKED]
transitions:
  - {from: ELIGIBLE, to: IMPLEMENT, when: dependency_receipts_and_business_decisions_valid}
  - {from: IMPLEMENT, to: TEST, when: real_required_tests_pass}
  - {from: TEST, to: COMMIT, when: scoped_diff_safe_and_task_commit_created}
  - {from: COMMIT, to: PUSH, when: push_succeeds}
  - {from: PUSH, to: DONE, when: committed_tests_pass_and_remote_sha_equals_head}
  - {from: IMPLEMENT, to: NEEDS_REWORK, when: tests_fail}
state_store: .runtime/state.json is a cache; validated Git/test receipts determine completion
ci: reported separately, never assumed passed
no_auto_merge_to_main: true

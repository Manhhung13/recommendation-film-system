name: movie-rec-product
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Repository acceptance tests
        run: python -B -m pytest -q tests
      # Currently harness acceptance only. Future product tests run as added;
      # no data/model acceptance is claimed before those tests exist and run.
